<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WordRadar</title>
    <style>
      body {
        margin: 0;
        padding: 12px 16px;
        min-width: 240px;
        font-family: system-ui, sans-serif;
        font-size: 14px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      .counts {
        display: flex;
        gap: 16px;
        margin-top: 8px;
      }
      .count-item {
        display: flex;
        flex-direction: column;
      }
      .count-label {
        color: #888;
        font-size: 11px;
      }
      .count-value {
        font-size: 18px;
        font-weight: 600;
      }
      button {
        margin-top: 12px;
      }
      [data-testid="version"] {
        margin-top: 12px;
        color: #888;
        font-size: 12px;
      }
      [data-testid="status"] {
        margin: 4px 0 0;
        color: #555;
        font-size: 12px;
        min-height: 1em;
      }
      .push {
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid #eee;
      }
      .push-stats {
        color: #555;
        font-size: 12px;
        line-height: 1.6;
      }
        margin-top: 12px;
        padding-top: 8px;
        border-top: 1px solid #eee;
      }
      .login-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .login-status {
        font-size: 12px;
        color: #555;
      }
      .login-status[data-state="logged-in"] {
        color: #0a7d2c;
      }
      .login-status[data-state="logged-out"] {
        color: #b0000;
      }
      .login-actions {
        margin-top: 8px;
        display: flex;
        gap: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>WordRadar</h1>
      <div class="counts">
        <div class="count-item">
          <span class="count-label">累计采集</span>
          <span class="count-value" data-testid="total">—</span>
        </div>
        <div class="count-item">
          <span class="count-label">待推</span>
          <span class="count-value" data-testid="pending">—</span>
        </div>
      </div>
      <p data-testid="status">采集中…</p>
      <button type="button" data-testid="collect">重新采集</button>
      <section class="push">
        <div class="push-stats" data-testid="push-status">推送状态：空闲</div>
        <div class="push-stats">
          成功 <span data-testid="push-succeeded">0</span> ·
          已存在 <span data-testid="push-existing">0</span> ·
          失败 <span data-testid="push-failed">0</span>
        </div>
        <button type="button" data-testid="retry-push">重试待推</button>
      </section>
      <section class="login">
        <div class="login-row">
          <span class="login-status" data-testid="login-status" data-state="unknown">登录状态：未知</span>
        </div>
        <div class="login-actions">
          <button type="button" data-testid="check-login">检查登录</button>
          <button type="button" data-testid="open-bbdc" hidden>打开不背单词</button>
        </div>
      </section>
      <p data-testid="version"></p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
